<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apresentação</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/revisao.css">
  <link rel="stylesheet" href="/assets/seminario.css">
</head>
<body class="presenter">
  <a class="skip-link" href="#deck">Ir para os slides</a>
  <div class="connection" role="status">Conexão interrompida. Reconectando…</div>
  <main class="deck" id="deck" tabindex="-1"></main>

  <button class="corner-qr" id="cornerQr" type="button" aria-label="Ampliar QR code de participação" aria-haspopup="dialog" aria-controls="qrDialog">
    <canvas aria-hidden="true"></canvas>
  </button>

  <dialog class="qr-dialog" id="qrDialog" aria-labelledby="qrDialogTitle">
    <button class="qr-close" id="closeQr" type="button" autofocus>Fechar</button>
    <h2 id="qrDialogTitle">Participe pelo celular</h2>
    <canvas id="expandedQr" role="img" aria-label="QR code para a página de participação"></canvas>
    <a id="qrParticipantLink" target="_blank" rel="noopener noreferrer">Abrir página de participação</a>
  </dialog>

  <div class="presenter-chrome" aria-label="Controles da apresentação">
    <span class="slide-counter" id="slideCounter" aria-live="polite"></span>
    <div class="pace-participation">
    <button class="pace" id="pace" type="button" title="Clique para iniciar, pausar ou zerar (duplo clique)">
      <span class="pace-clock" id="paceClock">00:00</span>
      <span class="pace-delta" id="paceDelta">pronto</span>
    </button>
    <a class="participation-link" href="https://grafos.presentation-template.workers.dev/participar/" target="_blank" rel="noopener noreferrer" title="Abrir página de participação">grafos.presentation-template.workers.dev/participar/</a>
    </div>
    <div class="chrome-actions">
      <button class="icon-button" id="previousSlide" type="button" aria-label="Slide anterior">←</button>
      <button class="icon-button" id="nextSlide" type="button" aria-label="Próximo slide">→</button>
      <button class="icon-button" id="toggleFullscreen" type="button" aria-label="Alternar tela cheia">⛶</button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

  <script src="/assets/qrcode.js"></script>
  <script src="/assets/sync.js"></script>
  <script type="module">
    import { CONFIG } from '/presentation.config.js';
    import { activityForSlide } from '/assets/activity.js';
    import { slideMarkup } from '/assets/render.js';

    const deck = document.querySelector('#deck');
    const slideCounter = document.querySelector('#slideCounter');
    const progressBar = document.querySelector('#progressBar');
    const cornerQr = document.querySelector('#cornerQr');
    const participantUrl = new URL('/participar/', location.origin).href;
    let currentIndex = -1;
    let isController = false;
    let roomState = { connected: 0, polls: {} };

    const escapeHtml = value => {
      const node = document.createElement('div');
      node.textContent = value ?? '';
      return node.innerHTML;
    };

    const safeColors = CONFIG.brand?.colors || {};
    const colorTokens = {
      background: '--color-bg',
      surface: '--color-surface',
      text: '--color-text',
      muted: '--color-text-muted',
      accent: '--color-accent',
      accentStrong: '--color-accent-strong'
    };
    for (const [name, token] of Object.entries(colorTokens)) {
      if (safeColors[name]) document.documentElement.style.setProperty(token, safeColors[name]);
    }

    document.title = CONFIG.title;

    const renderOptions = { polls: CONFIG.polls, participantUrl };

    deck.innerHTML = CONFIG.slides.map((slide, index) => (
      `<section class="slide" data-index="${index}" data-kind="${escapeHtml(slide.original && !slide.reveal ? 'original' : slide.type)}" data-activity="${escapeHtml(activityForSlide(slide))}" aria-hidden="true"><span class="slide-owner" aria-label="Parte ${slide.parte}">${slide.parte}</span>${slideMarkup(slide, renderOptions)}</section>`
    )).join('');

    document.querySelectorAll('[data-carousel]').forEach(carousel => {
      const panels = [...carousel.querySelectorAll('[data-carousel-panel]')];
      const steps = [...carousel.querySelectorAll('[data-carousel-goto]')];
      carousel.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        let index = Number(carousel.dataset.step);
        if (button.hasAttribute('data-carousel-prev')) index--;
        else if (button.hasAttribute('data-carousel-next')) index++;
        else if (button.hasAttribute('data-carousel-goto')) index = Number(button.dataset.carouselGoto);
        else return;
        index = Math.max(0, Math.min(panels.length - 1, index));
        carousel.dataset.step = index;
        panels.forEach((panel, i) => { panel.hidden = i !== index; });
        carousel.closest('.slide').querySelectorAll('[data-carousel-graph]').forEach((graph, i) => { graph.hidden = i !== index; });
        steps.forEach((step, i) => step.setAttribute('aria-pressed', String(i === index)));
        carousel.querySelector('[data-carousel-prev]').disabled = index === 0;
        carousel.querySelector('[data-carousel-next]').disabled = index === panels.length - 1;
        carousel.querySelector('[data-carousel-status]').textContent = `${index + 1} / ${panels.length} · ${steps[index].dataset.title}`;
      });
    });
    const slides = [...document.querySelectorAll('.slide')];
    document.querySelectorAll('.cover-qr, .exam-qr-canvas').forEach(canvas => LivePresentation.drawQr(canvas, participantUrl, 640));
    LivePresentation.drawQr(cornerQr.querySelector('canvas'), participantUrl, 320);
    const qrDialog = document.querySelector('#qrDialog');
    LivePresentation.drawQr(document.querySelector('#expandedQr'), participantUrl, 1024);
    document.querySelector('#qrParticipantLink').href = participantUrl;
    const openQr = () => qrDialog.showModal();
    cornerQr.addEventListener('click', openQr);
    document.querySelectorAll('.cover-qr-button, .exam-qr-button').forEach(button => button.addEventListener('click', openQr));
    document.querySelector('#closeQr').addEventListener('click', () => qrDialog.close());
    qrDialog.addEventListener('click', event => {
      const rect = qrDialog.getBoundingClientRect();
      if (event.target === qrDialog && (event.clientX < rect.left || event.clientX > rect.right
        || event.clientY < rect.top || event.clientY > rect.bottom)) qrDialog.close();
    });

    function renderPollResults() {
      // Layout de questão: a barra de votos vive DENTRO de cada alternativa.
      document.querySelectorAll('[data-poll-alternatives]').forEach(container => {
        const key = container.dataset.pollAlternatives;
        const result = roomState.polls?.[key] || { responses: 0, counts: {} };
        const counts = result.counts || {};
        const maximum = Math.max(1, ...Object.values(counts).map(Number));
        container.querySelectorAll('[data-alt-fill]').forEach(fill => {
          const count = Number(counts[fill.dataset.altFill] || 0);
          fill.style.width = `${count / maximum * 100}%`;
          fill.closest('.alt')?.classList.toggle('alt--lider', count > 0 && count === maximum);
        });
        container.querySelectorAll('[data-alt-pct]').forEach(node => {
          const count = Number(counts[node.dataset.altPct] || 0);
          node.textContent = result.responses
            ? `${Math.round(count / result.responses * 100)}%`
            : '—';
        });
      });

      document.querySelectorAll('[data-poll-results]').forEach(container => {
        const key = container.dataset.pollResults;
        const config = CONFIG.polls[key];
        const result = roomState.polls?.[key] || { responses: 0, counts: {} };
        const maximum = Math.max(1, ...config.options.map(option => result.counts?.[option.id] || 0));
        container.innerHTML = config.options.map(option => {
          const count = result.counts?.[option.id] || 0;
          const percentage = result.responses ? Math.round(count / result.responses * 100) : 0;
          const width = count / maximum * 100;
          return `<div class="result-row ${count > 0 && count === maximum ? 'is-leading' : ''}">
            <span class="result-label">${escapeHtml(option.label)}</span>
            <span class="result-track" aria-hidden="true"><span class="result-fill" style="width:${width}%"></span></span>
            <span class="result-value">${percentage}%</span>
          </div>`;
        }).join('');
      });

      document.querySelectorAll('[data-poll-summary]').forEach(summary => {
        const key = summary.dataset.pollSummary;
        const config = CONFIG.polls[key];
        const result = roomState.polls?.[key] || { responses: 0, counts: {} };
        const extra = config?.type === 'multiple' && result.responses
          ? ` · média de ${Number(result.average || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} escolhas por pessoa`
          : '';
        summary.textContent = result.responses
          ? `${result.responses} ${result.responses === 1 ? 'resposta' : 'respostas'}${extra}`
          : 'Aguardando respostas…';
      });
      document.querySelectorAll('[data-connected]').forEach(node => {
        node.textContent = roomState.connected || 0;
      });
    }

    function goTo(index, { updateHash = true } = {}) {
      const nextIndex = Math.max(0, Math.min(slides.length - 1, index));
      if (nextIndex === currentIndex) return;
      slides.forEach((slide, slideIndex) => {
        const active = slideIndex === nextIndex;
        slide.classList.toggle('is-active', active);
        slide.setAttribute('aria-hidden', String(!active));
      });
      currentIndex = nextIndex;
      slideCounter.textContent = `${nextIndex + 1} / ${slides.length}`;
      progressBar.style.width = `${(nextIndex + 1) / slides.length * 100}%`;
      const activity = slides[nextIndex].dataset.activity;
      cornerQr.classList.toggle('is-visible', activity.startsWith('poll:') && !slides[nextIndex].querySelector('.exam-qr'));
      if (updateHash) history.replaceState(null, '', `#/${nextIndex + 1}`);
      if (isController) connection.sendVital('activity', { type: 'activity', activity });
      if (typeof reportarPosicao === 'function') reportarPosicao();
      // O cronômetro começa sozinho quando você sai da capa.
      if (typeof startPaceOnFirstAdvance === 'function') startPaceOnFirstAdvance(nextIndex);
    }

    function indexFromHash() {
      const value = Number((location.hash.match(/\d+/) || [1])[0]);
      return Number.isFinite(value) ? value - 1 : 0;
    }

    /* --- cronômetro de ritmo -------------------------------------------
       Cada slide de seção declara `minutes`. Distribuímos esse orçamento
       igualmente entre os slides da seção para saber, em cada ponto, quantos
       minutos DEVERIAM ter passado. O relógio mostra o decorrido e o quanto
       você está adiantado ou atrasado em relação a esse plano. */
    const paceButton = document.querySelector('#pace');
    const paceClock = document.querySelector('#paceClock');
    const paceDelta = document.querySelector('#paceDelta');

    const expectedMinutes = (() => {
      const bounds = [];
      CONFIG.slides.forEach((slide, index) => {
        if (typeof slide.minutes === 'number') bounds.push({ index, minutes: slide.minutes });
      });
      const schedule = new Array(CONFIG.slides.length).fill(0);
      let elapsed = 0;
      bounds.forEach((section, order) => {
        const end = order + 1 < bounds.length ? bounds[order + 1].index : CONFIG.slides.length;
        const span = Math.max(1, end - section.index);
        for (let i = section.index; i < end; i += 1) {
          schedule[i] = elapsed + (i - section.index) / span * section.minutes;
        }
        elapsed += section.minutes;
      });
      // Slides antes da primeira seção (a capa) ficam no zero.
      return { schedule, total: elapsed || CONFIG.durationMinutes || 60 };
    })();

    let startedAt = null;
    let frozenMs = 0;

    const clockText = totalSeconds => {
      const sign = totalSeconds < 0 ? '−' : '';
      const value = Math.abs(Math.round(totalSeconds));
      return `${sign}${String(Math.floor(value / 60)).padStart(2, '0')}:${String(value % 60).padStart(2, '0')}`;
    };

    function renderPace() {
      const elapsedMs = startedAt === null ? frozenMs : frozenMs + (Date.now() - startedAt);
      const elapsedSeconds = elapsedMs / 1000;
      paceClock.textContent = clockText(elapsedSeconds);

      if (startedAt === null && elapsedMs === 0) {
        // Arredonda: somar durações fracionárias (0,4 min por slide de passo)
        // produz 140.4000000000001, e isso não pode chegar ao telão.
        paceDelta.textContent = `pronto · ${Math.round(expectedMinutes.total)} min`;
        paceButton.dataset.state = 'idle';
        return;
      }
      const target = (expectedMinutes.schedule[currentIndex] || 0) * 60;
      const drift = elapsedSeconds - target;
      const late = drift > 45;
      const early = drift < -45;
      paceDelta.textContent = late ? `atrasado ${clockText(drift)}`
        : early ? `adiantado ${clockText(-drift)}`
        : 'no ritmo';
      paceButton.dataset.state = startedAt === null ? 'paused' : late ? 'late' : early ? 'early' : 'ontime';
    }

    function startPaceOnFirstAdvance(index) {
      if (startedAt === null && frozenMs === 0 && index > 0) startedAt = Date.now();
      renderPace();
    }

    paceButton.addEventListener('click', () => {
      if (startedAt === null) {
        startedAt = Date.now();
      } else {
        frozenMs += Date.now() - startedAt;
        startedAt = null;
      }
      renderPace();
    });
    paceButton.addEventListener('dblclick', () => {
      startedAt = null;
      frozenMs = 0;
      renderPace();
    });
    setInterval(renderPace, 1000);
    renderPace();

    document.querySelector('#previousSlide').addEventListener('click', () => goTo(currentIndex - 1));
    document.querySelector('#nextSlide').addEventListener('click', () => goTo(currentIndex + 1));
    document.querySelector('#toggleFullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    addEventListener('hashchange', () => goTo(indexFromHash(), { updateHash: false }));
    addEventListener('keydown', event => {
      if (qrDialog.open) return;
      if (event.target.closest('button, a, input, textarea, select, summary, [contenteditable]')) return;
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
        goTo(currentIndex + 1);
      } else if (['ArrowLeft', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        goTo(currentIndex - 1);
      } else if (event.key === 'Home') {
        event.preventDefault();
        goTo(0);
      } else if (event.key === 'End') {
        event.preventDefault();
        goTo(slides.length - 1);
      } else if (event.key.toLowerCase() === 'f') {
        event.preventDefault();
        document.querySelector('#toggleFullscreen').click();
      }
    });

    const connection = LivePresentation.connect({
      role: 'presenter',
      onState: nextState => {
        roomState = nextState;
        renderPollResults();
      },
      onHello: message => {
        isController = Boolean(message.authorized);
        if (isController && currentIndex >= 0) {
          connection.sendVital('activity', { type: 'activity', activity: slides[currentIndex].dataset.activity });
          reportarPosicao();
        }
      },
      // Comando vindo do celular. O telão é quem manda na navegação local;
      // aqui ele só reage, e a posição volta pelo reportarPosicao() do goTo.
      onSlide: message => {
        if (message.action === 'next') goTo(currentIndex + 1);
        else if (message.action === 'previous') goTo(currentIndex - 1);
        else if (message.action === 'first') goTo(0);
        else if (message.action === 'last') goTo(slides.length - 1);
      }
    });

    /** Informa à régie em que slide o telão está. */
    function reportarPosicao() {
      if (!isController || currentIndex < 0) return;
      const titulo = slides[currentIndex].querySelector('h1')?.textContent?.trim() || '';
      connection.send({ type: 'slide_at', index: currentIndex, total: slides.length, title: titulo });
    }

    goTo(indexFromHash(), { updateHash: false });
    renderPollResults();
  </script>
</body>
</html>
